services:
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: jobdri-api
    env_file:
      - .env
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:-jdbc:postgresql://postgres:5432/jobdri}
      DB_USERNAME: ${DB_USERNAME:-jobdri}
      DB_PASSWORD: ${DB_PASSWORD:-jobdri}
      DB_DRIVER: ${DB_DRIVER:-org.postgresql.Driver}
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD:
      REDIS_SSL_ENABLED: false
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      APP_WORKER_INTERNAL_API_KEY: ${APP_WORKER_INTERNAL_API_KEY:-change-me-internal-worker-key}
      APP_LOG_PATH: ${APP_LOG_PATH:-/var/log/spring-boot}
      APP_AUDIT_LOG_PATH: ${APP_AUDIT_LOG_PATH:-/var/log/spring-boot/audit}
    ports:
      - "8080:8080"
    volumes:
      - spring-boot-logs:/var/log/spring-boot
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: worker/Dockerfile
    container_name: jobdri-worker
    env_file:
      - .env
    environment:
      WORKER_ENV: docker
      SPRING_API_BASE_URL: http://api:8080
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_PORT: 5672
      RABBITMQ_USERNAME: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_VHOST: ${RABBITMQ_VHOST:-/}
      APP_WORKER_JOB_POSTING_EXCHANGE: ${APP_WORKER_JOB_POSTING_EXCHANGE:-jobdri.worker.exchange}
      APP_WORKER_JOB_POSTING_QUEUE: ${APP_WORKER_JOB_POSTING_QUEUE:-jobdri.job-posting.ingest}
      APP_WORKER_JOB_POSTING_ROUTING_KEY: ${APP_WORKER_JOB_POSTING_ROUTING_KEY:-job-posting.ingest}
      APP_WORKER_JOB_POSTING_DLQ: ${APP_WORKER_JOB_POSTING_DLQ:-jobdri.job-posting.ingest.dlq}
      APP_WORKER_INTERNAL_API_KEY: ${APP_WORKER_INTERNAL_API_KEY:-change-me-internal-worker-key}
      JOB_POSTING_CLASSIFICATION_CONFIDENCE_THRESHOLD: ${JOB_POSTING_CLASSIFICATION_CONFIDENCE_THRESHOLD:-0.65}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_JOB_POSTING_MODEL: ${OPENAI_JOB_POSTING_MODEL:-gpt-4o-mini}
      WORKER_MAX_RETRY_COUNT: ${WORKER_MAX_RETRY_COUNT:-3}
    depends_on:
      api:
        condition: service_started
      rabbitmq:
        condition: service_healthy
    ports:
      - "8000:8000"
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: jobdri-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  postgres:
    image: pgvector/pgvector:pg16@sha256:1d533553fefe4f12e5d80c7b80622ba0c382abb5758856f52983d8789179f0fb
    container_name: jobdri-postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-jobdri}
      POSTGRES_USER: ${DB_USERNAME:-jobdri}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-jobdri}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-jobdri} -d ${POSTGRES_DB:-jobdri}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: jobdri-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USERNAME:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-guest}
      RABBITMQ_DEFAULT_VHOST: ${RABBITMQ_VHOST:-/}
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  loki:
    image: grafana/loki:3.5.6
    container_name: jobdri-loki
    command: ["-config.file=/etc/loki/local-config.yaml"]
    volumes:
      - ./ops/observability/loki-config.yaml:/etc/loki/local-config.yaml:ro
      - loki-data:/loki
    ports:
      - "3100:3100"
    restart: unless-stopped

  alloy:
    image: grafana/alloy:v1.10.2
    container_name: jobdri-alloy
    command:
      - run
      - /etc/alloy/config.alloy
      - --storage.path=/var/lib/alloy
    volumes:
      - ./ops/observability/alloy-config.alloy:/etc/alloy/config.alloy:ro
      - spring-boot-logs:/var/log/spring-boot:ro
      - alloy-data:/var/lib/alloy
    depends_on:
      - api
      - loki
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: jobdri-prometheus
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
    volumes:
      - ./ops/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    depends_on:
      - api
      - node-exporter
    restart: unless-stopped

  node-exporter:
    image: prom/node-exporter:v1.9.1
    container_name: jobdri-node-exporter
    command:
      - --path.rootfs=/host
    volumes:
      - /:/host:ro,rslave
    pid: host
    restart: unless-stopped

  grafana:
    image: grafana/grafana:12.1.1
    container_name: jobdri-grafana
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    depends_on:
      - loki
      - prometheus
    restart: unless-stopped

volumes:
  postgres-data:
  spring-boot-logs:
  loki-data:
  alloy-data:
  prometheus-data:
  grafana-data:
