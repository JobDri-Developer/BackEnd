global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "server_metric"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["api:9090"]
        labels:
          instance: "ceos-app"

  - job_name: "analysis_worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["worker:8000"]
        labels:
          instance: "analysis-worker"

  - job_name: "node_exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: "server-host"