global:
  scrape_interval: 15s

scrape_configs:
  - job_name: "server_metric"
    metrics_path: "/actuator/prometheus"
    static_configs:
      - targets: ["api:9090"]
        labels:
          instance: "ceos-app"

  # This target assumes the external analysis worker container exposes a FastAPI
  # metrics endpoint on 0.0.0.0:8000/metrics inside the same Docker network.
  # The backend root Dockerfile in this repo is API-only (8080) and does not
  # provide this route. If the deployed worker image does not expose /metrics,
  # update the target to the real worker endpoint or remove this job.
  - job_name: "analysis_worker"
    metrics_path: "/metrics"
    static_configs:
      - targets: ["worker:8000"]
        labels:
          instance: "analysis-worker"

  - job_name: "node_exporter"
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          instance: "server-host"
