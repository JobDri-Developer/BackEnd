spring:
  sql:
    init:
      mode: never
  cloud:
    aws:
      credentials:
        access-key: test-access-key
        secret-key: test-secret-key
      region:
        static: ap-northeast-2
      s3:
        bucket: test-bucket
        presign-get-expiration-minutes: 10
        presign-put-expiration-minutes: 5
  datasource:
    url: jdbc:h2:mem:jobdri-test;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    username: sa
    password:
    driver-class-name: org.h2.Driver
  jpa:
    hibernate:
      ddl-auto: create-drop
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: localhost
      port: 6379
      password:
      ssl:
        enabled: false
  mail:
    host: localhost
    port: 1025
    username:
    password:
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: false
          starttls:
            enable: false
          connectiontimeout: 1000
          timeout: 1000
          writetimeout: 1000
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: test-google-client-id
            client-secret: test-google-client-secret
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

mail:
  from: test@example.com

app:
  oauth2:
    redirect-uri: http://localhost:3000/oauth2/redirect

jwt:
  secret:
    key: am9iZHJpLWxvY2FsLXNlY3JldC1rZXktZm9yLWRldmVsb3BtZW50LTIwMjYtam9iZHJp
  expiration:
    access-token: 3600000
    refresh-token: 1209600000

job-posting:
  image-upload:
    max-size-bytes: 5242880

payment:
  toss:
    client-key: test-toss-client-key
    secret-key: test-toss-secret-key
    base-url: https://api.tosspayments.com
