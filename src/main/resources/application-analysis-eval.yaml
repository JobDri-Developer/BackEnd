spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.devtools.autoconfigure.DevToolsDataSourceAutoConfiguration

  main:
    web-application-type: none
  devtools:
    add-properties: false
    restart:
      enabled: false

  sql:
    init:
      mode: never

  datasource:
    url: ${EVAL_DB_URL:jdbc:h2:mem:analysis_eval;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${EVAL_DB_USERNAME:sa}
    password: ${EVAL_DB_PASSWORD:}
    driver-class-name: ${EVAL_DB_DRIVER:org.h2.Driver}

  jpa:
    hibernate:
      ddl-auto: none
    defer-datasource-initialization: false
    open-in-view: false

  mail:
    host: localhost
    port: 2525
    username: dummy
    password: dummy

  security:
    oauth2:
      client:
        registration:
          google:
            client-id: dummy-google-client-id
            client-secret: dummy-google-client-secret
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"

  cloud:
    aws:
      credentials:
        access-key: dummy-access-key
        secret-key: dummy-secret-key
      region:
        static: ap-northeast-2
      s3:
        bucket: dummy-bucket
        presign-get-expiration-minutes: 10
        presign-put-expiration-minutes: 5

app:
  admin:
    bootstrap-emails: ""
  corpus:
    import:
      run-on-startup: false
      xlsx-path: ""
    embedding:
      sync-on-startup: false

evaluation:
  analysis:
    enabled: false
  nlg-judge:
    enabled: false
    input: ""
    output: ""
    model: ${OPENAI_NLG_JUDGE_MODEL:gpt-4o-mini}
  hybrid-merge:
    enabled: false
    single-pass-input: ""
    two-pass-input: ""
    output: ""
  missing-keyword-replay:
    enabled: false
    input: ""
    output: ""
    review-output: ""

analysis:
  few-shot:
    dynamic-selection-enabled: ${ANALYSIS_FEW_SHOT_DYNAMIC_SELECTION_ENABLED:false}
    dataset-version: ${ANALYSIS_FEW_SHOT_DATASET_VERSION:fewshot-static-v1}
    curated-resource: ${ANALYSIS_FEW_SHOT_CURATED_RESOURCE:analysis/fewshot/curated-fewshot-cases.json}
    reviewed-evaluation-resource: ${ANALYSIS_FEW_SHOT_REVIEWED_EVALUATION_RESOURCE:analysis/fewshot/reviewed-fewshot-cases.json}
    reviewed-evaluation-csv-path: ${ANALYSIS_FEW_SHOT_REVIEWED_EVALUATION_CSV_PATH:}
    fallback-enabled: ${ANALYSIS_FEW_SHOT_FALLBACK_ENABLED:true}
    cache-enabled: ${ANALYSIS_FEW_SHOT_CACHE_ENABLED:true}
    cache-ttl: ${ANALYSIS_FEW_SHOT_CACHE_TTL:30m}
    source:
      fixed-enabled: ${ANALYSIS_FEW_SHOT_FIXED_ENABLED:true}
      curated-enabled: ${ANALYSIS_FEW_SHOT_CURATED_ENABLED:true}
      reviewed-evaluation-enabled: ${ANALYSIS_FEW_SHOT_REVIEWED_EVALUATION_ENABLED:false}
      reviewed-production-enabled: ${ANALYSIS_FEW_SHOT_REVIEWED_PRODUCTION_ENABLED:false}
    search:
      candidate-limit: ${ANALYSIS_FEW_SHOT_CANDIDATE_LIMIT:30}
      top-k: ${ANALYSIS_FEW_SHOT_TOP_K:5}
      min-rerank-score: ${ANALYSIS_FEW_SHOT_MIN_RERANK_SCORE:-1.0}
      diversity-enabled: ${ANALYSIS_FEW_SHOT_DIVERSITY_ENABLED:true}

cohere:
  api-key: ${COHERE_API_KEY:}
  base-url: ${COHERE_BASE_URL:https://api.cohere.com}
  embedding:
    model: ${COHERE_EMBEDDING_MODEL:embed-v4.0}
    dimension: ${COHERE_EMBEDDING_DIMENSION:1024}
    connect-timeout: ${COHERE_EMBEDDING_CONNECT_TIMEOUT:3s}
    read-timeout: ${COHERE_EMBEDDING_READ_TIMEOUT:15s}

jwt:
  secret:
    key: ${JWT_SECRET_KEY:am9iZHJpLWFuYWx5c2lzLWV2YWwtbG9jYWwtc2VjcmV0LWtleQ==}
  expiration:
    access-token: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
    refresh-token: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

payment:
  toss:
    client-key: ${TOSS_CLIENT_KEY:dummy-evaluation-client-key}
    secret-key: ${TOSS_SECRET_KEY:dummy-evaluation-secret-key}
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}
  toss-pay:
    api-base-url: ${TOSS_PAY_API_BASE_URL:https://pay.toss.im}
    api-key: ${TOSS_PAY_API_KEY:dummy-evaluation-toss-pay-api-key}
    return-url: ${TOSS_PAY_RETURN_URL:http://localhost:3000/credit/payment-result}
    cancel-url: ${TOSS_PAY_CANCEL_URL:http://localhost:3000/credit/payment-cancel}
    result-callback-url: ${TOSS_PAY_RESULT_CALLBACK_URL:http://localhost:8080/api/payments/toss/callback}
  portone:
    enabled: ${PORTONE_ENABLED:false}
    api-base-url: ${PORTONE_API_BASE_URL:https://api.portone.io}
    store-id: ${PORTONE_STORE_ID:dummy-evaluation-store-id}
    channel-key: ${PORTONE_CHANNEL_KEY:dummy-evaluation-channel-key}
    api-secret: ${PORTONE_API_SECRET:dummy-evaluation-api-secret}
    redirect-url: ${PORTONE_REDIRECT_URL:http://localhost:3000/credit/payment-result}
    webhook-secret: ${PORTONE_WEBHOOK_SECRET:dummy-evaluation-webhook-secret}
