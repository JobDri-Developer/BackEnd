spring:
  application:
    name: jobdri-api
  datasource:
    url: ${DB_URL:jdbc:h2:mem:jobdri;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false

server:
  port: 8080

jwt:
  secret:
    key: ${JWT_SECRET_KEY:am9iZHJpLWxvY2FsLXNlY3JldC1rZXktZm9yLWRldmVsb3BtZW50LTIwMjYtam9iZHJp}
  expiration:
    access-token: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
    refresh-token: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}
