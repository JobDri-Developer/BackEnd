spring:
  application:
    name: jobdri-api
  sql:
    init:
      mode: always
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/jobdri}
    username: ${DB_USERNAME:jobdri}
    password: ${DB_PASSWORD:jobdri}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL_ENABLED:false}
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH:true}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE:true}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT:5000}
          timeout: ${MAIL_SMTP_TIMEOUT:5000}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT:5000}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID:dummy-google-client-id}
            client-secret: ${GOOGLE_CLIENT_SECRET:dummy-google-client-secret}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID:dummy-access-key}
        secret-key: ${AWS_SECRET_ACCESS_KEY:dummy-secret-key}
      region:
        static: ${AWS_REGION:ap-northeast-2}
      s3:
        bucket: ${S3_BUCKET:dummy-bucket}
        presign-get-expiration-minutes: ${S3_PRESIGN_GET_EXPIRATION_MINUTES:10}
        presign-put-expiration-minutes: ${S3_PRESIGN_PUT_EXPIRATION_MINUTES:5}

mail:
  from: ${MAIL_FROM:${MAIL_USERNAME:}}

app:
  oauth2:
    redirect-uri: ${APP_OAUTH2_REDIRECT_URI:http://localhost:3000/oauth2/redirect}

server:
  port: 8080

jwt:
  secret:
    key: ${JWT_SECRET_KEY:am9iZHJpLWxvY2FsLXNlY3JldC1rZXktZm9yLWRldmVsb3BtZW50LTIwMjYtam9iZHJp}
  expiration:
    access-token: ${JWT_ACCESS_TOKEN_EXPIRATION:3600000}
    refresh-token: ${JWT_REFRESH_TOKEN_EXPIRATION:1209600000}

openai:
  api:
    key: ${OPENAI_API_KEY:}
  model:
    job-posting-extractor: ${OPENAI_JOB_POSTING_MODEL:gpt-4o-mini}

job-posting:
  ingest:
    classification-confidence-threshold: ${JOB_POSTING_CLASSIFICATION_CONFIDENCE_THRESHOLD:0.65}
  image-upload:
    max-size-bytes: ${JOB_POSTING_IMAGE_UPLOAD_MAX_SIZE_BYTES:5242880}

async:
  job-posting:
    core-pool-size: ${JOB_POSTING_ASYNC_CORE_POOL_SIZE:2}
    max-pool-size: ${JOB_POSTING_ASYNC_MAX_POOL_SIZE:4}
    queue-capacity: ${JOB_POSTING_ASYNC_QUEUE_CAPACITY:20}
  mail:
    core-pool-size: ${MAIL_ASYNC_CORE_POOL_SIZE:1}
    max-pool-size: ${MAIL_ASYNC_MAX_POOL_SIZE:2}
    queue-capacity: ${MAIL_ASYNC_QUEUE_CAPACITY:50}
