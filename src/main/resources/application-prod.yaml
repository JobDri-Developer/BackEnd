spring:
  application:
    name: jobdri-api
  sql:
    init:
      mode: never
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER:org.postgresql.Driver}
  jpa:
    hibernate:
      ddl-auto: ${JPA_DDL_AUTO:update}
    defer-datasource-initialization: false
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED}
  rabbitmq:
    host: ${RABBITMQ_HOST}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME}
    password: ${RABBITMQ_PASSWORD}
    virtual-host: ${RABBITMQ_VHOST:/}
    publisher-confirm-type: correlated
    publisher-returns: true
    template:
      mandatory: true
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        smtp:
          auth: ${MAIL_SMTP_AUTH}
          starttls:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE}
          connectiontimeout: ${MAIL_SMTP_CONNECTION_TIMEOUT}
          timeout: ${MAIL_SMTP_TIMEOUT}
          writetimeout: ${MAIL_SMTP_WRITE_TIMEOUT}
  security:
    oauth2:
      client:
        registration:
          google:
            client-id: ${GOOGLE_CLIENT_ID}
            client-secret: ${GOOGLE_CLIENT_SECRET}
            scope:
              - email
              - profile
            redirect-uri: "{baseUrl}/login/oauth2/code/{registrationId}"
  cloud:
    aws:
      credentials:
        access-key: ${AWS_ACCESS_KEY_ID}
        secret-key: ${AWS_SECRET_ACCESS_KEY}
      region:
        static: ${AWS_REGION}
      s3:
        bucket: ${S3_BUCKET}
        presign-get-expiration-minutes: ${S3_PRESIGN_GET_EXPIRATION_MINUTES:10}
        presign-put-expiration-minutes: ${S3_PRESIGN_PUT_EXPIRATION_MINUTES:5}

mail:
  from: ${MAIL_FROM:${MAIL_USERNAME:}}

app:
  logging:
    path: ${APP_LOG_PATH:/var/log/spring-boot}
    audit-path: ${APP_AUDIT_LOG_PATH:/var/log/spring-boot/audit}
  oauth2:
    redirect-uri: ${APP_OAUTH2_REDIRECT_URI}
  worker:
    exchange: ${APP_WORKER_EXCHANGE:jobdri.worker.exchange}
    internal-api-key: ${APP_WORKER_INTERNAL_API_KEY}
    publish-confirm-timeout-millis: ${APP_WORKER_PUBLISH_CONFIRM_TIMEOUT_MILLIS:5000}
    job-posting:
      exchange: ${APP_WORKER_JOB_POSTING_EXCHANGE:${APP_WORKER_EXCHANGE:jobdri.worker.exchange}}
      queue: ${APP_WORKER_JOB_POSTING_QUEUE:jobdri.job-posting.ingest}
      routing-key: ${APP_WORKER_JOB_POSTING_ROUTING_KEY:job-posting.ingest}
      dlq: ${APP_WORKER_JOB_POSTING_DLQ:jobdri.job-posting.ingest.dlq}
      max-retry-count: ${APP_WORKER_JOB_POSTING_MAX_RETRY_COUNT:3}
      queue-timeout-seconds: ${APP_WORKER_JOB_POSTING_QUEUE_TIMEOUT_SECONDS:30}
      processing-timeout-seconds: ${APP_WORKER_JOB_POSTING_PROCESSING_TIMEOUT_SECONDS:60}
      queue-timeout-minutes: ${APP_WORKER_JOB_POSTING_QUEUE_TIMEOUT_MINUTES:10}
      processing-timeout-minutes: ${APP_WORKER_JOB_POSTING_PROCESSING_TIMEOUT_MINUTES:20}
    analysis:
      exchange: ${APP_WORKER_ANALYSIS_EXCHANGE:${APP_WORKER_EXCHANGE:jobdri.worker.exchange}}
      queue: ${APP_WORKER_ANALYSIS_QUEUE:jobdri.analysis.execute}
      routing-key: ${APP_WORKER_ANALYSIS_ROUTING_KEY:analysis.execute}
      dlq: ${APP_WORKER_ANALYSIS_DLQ:jobdri.analysis.execute.dlq}
      max-retry-count: ${APP_WORKER_ANALYSIS_MAX_RETRY_COUNT:3}
      queue-timeout-seconds: ${APP_WORKER_ANALYSIS_QUEUE_TIMEOUT_SECONDS:120}
      processing-timeout-seconds: ${APP_WORKER_ANALYSIS_PROCESSING_TIMEOUT_SECONDS:600}
      queue-timeout-minutes: ${APP_WORKER_ANALYSIS_QUEUE_TIMEOUT_MINUTES:10}
      processing-timeout-minutes: ${APP_WORKER_ANALYSIS_PROCESSING_TIMEOUT_MINUTES:20}
  admin:
    bootstrap-emails: ${APP_ADMIN_BOOTSTRAP_EMAILS:}
  corpus:
    import:
      run-on-startup: ${APP_CORPUS_IMPORT_RUN_ON_STARTUP:false}
      xlsx-path: ${APP_CORPUS_IMPORT_XLSX_PATH:}
      allowed-root: ${APP_CORPUS_IMPORT_ALLOWED_ROOT:}
    embedding:
      sync-on-startup: ${APP_CORPUS_EMBEDDING_SYNC_ON_STARTUP:false}
      model: ${APP_CORPUS_EMBEDDING_MODEL:embed-v4.0}
      output-dimension: ${APP_CORPUS_EMBEDDING_OUTPUT_DIMENSION:1024}
      document-input-type: ${APP_CORPUS_EMBEDDING_DOCUMENT_INPUT_TYPE:search_document}
      batch-size: ${APP_CORPUS_EMBEDDING_BATCH_SIZE:32}
  analysis:
    retrieval:
      jd-limit: ${APP_ANALYSIS_RETRIEVAL_JD_LIMIT:3}
      question-limit: ${APP_ANALYSIS_RETRIEVAL_QUESTION_LIMIT:5}

server:
  port: 8080
  forward-headers-strategy: framework

management:
  server:
    port: 9090
  metrics:
    distribution:
      percentiles-histogram:
        http:
          server:
            requests: true
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      show-details: ${MANAGEMENT_HEALTH_SHOW_DETAILS:never}
      probes:
        enabled: true
    prometheus:
      access: unrestricted

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
  expiration:
    access-token: ${JWT_ACCESS_TOKEN_EXPIRATION}
    refresh-token: ${JWT_REFRESH_TOKEN_EXPIRATION}

openai:
  api:
    key: ${OPENAI_API_KEY}
  model:
    job-posting-extractor: ${OPENAI_JOB_POSTING_MODEL:gpt-4o-mini}

cohere:
  api:
    key: ${COHERE_API_KEY:}

payment:
  coupon:
    code: ${PAYMENT_COUPON_CODE}
  toss:
    client-key: ${TOSS_CLIENT_KEY}
    secret-key: ${TOSS_SECRET_KEY}
    base-url: ${TOSS_BASE_URL:https://api.tosspayments.com}

job-posting:
  ingest:
    classification-confidence-threshold: ${JOB_POSTING_CLASSIFICATION_CONFIDENCE_THRESHOLD:0.65}
  image-upload:
    max-size-bytes: ${JOB_POSTING_IMAGE_UPLOAD_MAX_SIZE_BYTES:5242880}

async:
  job-posting:
    core-pool-size: ${JOB_POSTING_ASYNC_CORE_POOL_SIZE:2}
    max-pool-size: ${JOB_POSTING_ASYNC_MAX_POOL_SIZE:4}
    queue-capacity: ${JOB_POSTING_ASYNC_QUEUE_CAPACITY:20}
  mail:
    core-pool-size: ${MAIL_ASYNC_CORE_POOL_SIZE:1}
    max-pool-size: ${MAIL_ASYNC_MAX_POOL_SIZE:2}
    queue-capacity: ${MAIL_ASYNC_QUEUE_CAPACITY:50}
  llm:
    core-pool-size: ${LLM_ASYNC_CORE_POOL_SIZE:2}
    max-pool-size: ${LLM_ASYNC_MAX_POOL_SIZE:4}
    queue-capacity: ${LLM_ASYNC_QUEUE_CAPACITY:20}

llm:
  concurrency:
    max-concurrent-requests: ${LLM_MAX_CONCURRENT_REQUESTS:4}
    acquire-timeout-millis: ${LLM_CONCURRENCY_ACQUIRE_TIMEOUT_MILLIS:3000}
