spring:
  application:
    name: jobdri-api
  datasource:
    url: ${DB_URL:jdbc:h2:mem:jobdri;MODE=PostgreSQL;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: ${DB_DRIVER}
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
    open-in-view: false
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT}
      password: ${REDIS_PASSWORD}
      ssl:
        enabled: ${REDIS_SSL_ENABLED}
  mail:
    host: ${MAIL_HOST}
    port: ${MAIL_PORT}
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    default-encoding: UTF-8
    properties:
      mail:
        SMTP:
          auth: ${MAIL_SMTP_AUTH}
          STARTTLS:
            enable: ${MAIL_SMTP_STARTTLS_ENABLE}
          connection timeout: ${MAIL_SMTP_CONNECTION_TIMEOUT}
          timeout: ${MAIL_SMTP_TIMEOUT}
          write timeout: ${MAIL_SMTP_WRITE_TIMEOUT}

mail:
  from: ${MAIL_FROM:${MAIL_USERNAME}}

server:
  port: 8080

jwt:
  secret:
    key: ${JWT_SECRET_KEY}
  expiration:
    access-token: ${JWT_ACCESS_TOKEN_EXPIRATION}
    refresh-token: ${JWT_REFRESH_TOKEN_EXPIRATION}
