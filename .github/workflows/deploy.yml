name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  IMAGE_NAME: ghcr.io/jobdri-developer/backend

jobs:
  build-and-push:
    name: Build and Push Image
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    outputs:
      image_digest: ${{ steps.build.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      - name: Grant Gradle permission
        run: chmod +x ./gradlew

      - name: Build application jar
        run: ./gradlew --no-daemon clean bootJar -x test

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:latest
            ${{ env.IMAGE_NAME }}:${{ github.sha }}

  deploy:
    name: Deploy to Server
    if: github.ref_name == 'main'
    runs-on: ubuntu-latest
    needs: build-and-push
    env:
      HAS_DEPLOY_SECRETS: ${{ secrets.DEPLOY_HOST != '' && secrets.DEPLOY_USER != '' && secrets.DEPLOY_SSH_KEY != '' && secrets.DEPLOY_SSH_FINGERPRINT != '' && secrets.DEPLOY_PATH != '' }}

    steps:
      - name: Checkout deployment configuration
        if: env.HAS_DEPLOY_SECRETS == 'true'
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Skip deploy when server secrets are missing
        if: env.HAS_DEPLOY_SECRETS != 'true'
        run: echo "Deployment skipped because required server secrets are not configured."

      - name: Upload Compose configuration
        if: env.HAS_DEPLOY_SECRETS == 'true'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "docker-compose.prod.yml"
          target: ${{ secrets.DEPLOY_PATH }}
          overwrite: true

      - name: Upload observability runtime configuration
        if: env.HAS_DEPLOY_SECRETS == 'true'
        uses: appleboy/scp-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          source: "ops/observability/alloy-config.alloy,ops/observability/loki-config.yaml,ops/observability/prometheus.yml"
          target: ${{ secrets.DEPLOY_PATH }}/ops/observability
          strip_components: 2
          overwrite: true

      - name: Deploy with Docker Compose
        if: env.HAS_DEPLOY_SECRETS == 'true'
        uses: appleboy/ssh-action@v1.2.0
        env:
          IMAGE_REF: ${{ env.IMAGE_NAME }}@${{ needs.build-and-push.outputs.image_digest }}
          GHCR_USERNAME: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          fingerprint: ${{ secrets.DEPLOY_SSH_FINGERPRINT }}
          port: ${{ secrets.DEPLOY_PORT || 22 }}
          envs: IMAGE_REF,GHCR_USERNAME,GHCR_TOKEN
          script: |
            cd "${{ secrets.DEPLOY_PATH }}"
            echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
            export IMAGE_REF="$IMAGE_REF"
            docker compose -f docker-compose.prod.yml pull
            docker compose -f docker-compose.prod.yml up -d --force-recreate --remove-orphans
            docker image prune -f
